<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter AI Chat</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fff;
      }

      /* Chat Body */
      #chat-body {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
      }

      .msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #38bdf8, #6b3fd4);
        color: white;
        border-bottom-right-radius: 2px;
      }

      .msg.bot {
        align-self: flex-start;
        background: #f1f5f9;
        color: #1e293b;
        border-bottom-left-radius: 2px;
      }

      .msg.bot.loading {
        color: #94a3b8;
        font-style: italic;
      }

      /* Footer */
      #chat-footer {
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 8px;
        background: #fff;
      }

      #chat-input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 24px;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
      }

      #chat-input:focus {
        border-color: #6b3fd4;
      }

      #chat-send {
        background: linear-gradient(135deg, #38bdf8, #6b3fd4);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 24px;
        cursor: pointer;
        font-size: 14px;
        transition: opacity 0.2s;
      }

      #chat-send:hover {
        opacity: 0.9;
      }

      #chat-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>

    <!-- Chat Messages -->
    <div id="chat-body">
      <div class="msg bot">Hi 👋 I'm your Twitter AI assistant. How can I help you?</div>
    </div>

    <!-- Input Footer -->
    <div id="chat-footer">
      <input
        type="text"
        id="chat-input"
        placeholder="Type your message..."
        autofocus
      />
      <button id="chat-send">Send</button>
    </div>

    <script>
      const webhookUrl =
        "https://n8n.navics.info/webhook/671e1c20-0451-490a-ba2b-578535ab37ff/chat";

      const chatBody = document.getElementById("chat-body");
      const chatInput = document.getElementById("chat-input");
      const sendButton = document.getElementById("chat-send");

      // Keep a stable session ID for this iframe session
      const sessionId = "tw_" + Math.random().toString(36).substr(2, 9);

      function appendMessage(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerHTML = text.replace(/\n/g, "<br>");
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
        return div;
      }

      async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        chatInput.value = "";
        sendButton.disabled = true;

        // Show loading indicator
        const loadingEl = appendMessage("Typing...", "bot loading");

        try {
          const response = await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chatInput: message,
              sessionId: sessionId,
            }),
          });

          const data = await response.json();
          const botReply = data.output || data.response || data.text || "No response";

          loadingEl.remove();
          appendMessage(botReply, "bot");
        } catch (error) {
          loadingEl.remove();
          appendMessage("⚠️ Error connecting to server.", "bot");
        }

        sendButton.disabled = false;
        chatInput.focus();
      }

      sendButton.addEventListener("click", sendMessage);
      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
