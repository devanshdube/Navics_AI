<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* Chat Body */
    #chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    table th {
      background: linear-gradient(135deg, #38bdf8, #6b3fd4);
      color: white;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #38bdf8, #6b3fd4);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 2px;
    }

    .msg.bot.loading {
      color: #94a3b8;
      font-style: italic;
    }

    /* Footer */
    #chat-footer {
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      background: #fff;
    }

    #chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    #chat-input:focus {
      border-color: #6b3fd4;
    }

    #chat-send {
      background: linear-gradient(135deg, #38bdf8, #6b3fd4);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    #chat-send:hover {
      opacity: 0.9;
    }

    #chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <!-- Chat Messages -->
  <div id="chat-body">
    <div class="msg bot">Hi 👋 I'm your Twitter AI assistant. How can I help you?</div>
  </div>

  <!-- Input Footer -->
  <div id="chat-footer">
    <input type="text" id="chat-input" placeholder="Type your message..." autofocus />
    <button id="chat-send">Send</button>
  </div>

  <script>
    const webhookUrl =
      "https://n8n.navics.info/webhook/671e1c20-0451-490a-ba2b-578535ab37ff/chat";

    const chatBody = document.getElementById("chat-body");
    const chatInput = document.getElementById("chat-input");
    const sendButton = document.getElementById("chat-send");

    // Keep a stable session ID for this iframe session
    const sessionId = "tw_" + Math.random().toString(36).substr(2, 9);

    function formatResponse(text) {
      if (!text.includes('|')) return text.replace(/\n/g, '<br>');

      const lines = text.trim().split('\n').map(l => l.trim()).filter(l => l);

      // Extract all non-separator, non-empty lines
      const dataLines = lines.filter(l => !/^[\|\-\s]+$/.test(l.replace(/[^|\-\s]/g, '')) || l.includes('Tweet'));

      // Find header line
      const headerLine = lines.find(l => l.includes('Tweet ID') || l.toLowerCase().includes('tweet'));
      if (!headerLine) return text.replace(/\n/g, '<br>');

      // Parse headers
      const headers = headerLine.split('|').map(h => h.trim()).filter(h => h);
      const colCount = headers.length;

      // Collect all cell values (skip header line and separator lines)
      const allValues = [];
      for (let line of lines) {
        if (line === headerLine) continue;
        if (/^[\|\-\s]+$/.test(line)) continue; // separator

        if (line.startsWith('|')) {
          // pipe-separated row
          const cells = line.split('|').map(c => c.trim()).filter(c => c !== '');
          allValues.push(...cells);
        } else {
          // standalone value line
          allValues.push(line);
        }
      }

      // Group values into rows of colCount
      const rows = [];
      for (let i = 0; i < allValues.length; i += colCount) {
        rows.push(allValues.slice(i, i + colCount));
      }

      // Build table
      let html = '<div style="overflow-x:auto;width:100%"><table style="border-collapse:collapse;width:100%;font-size:12px;">';

      // Header
      html += '<thead><tr>' + headers.map(h =>
        `<th style="background:linear-gradient(135deg,#38bdf8,#6b3fd4);color:white;padding:8px 10px;text-align:left;white-space:nowrap;border:1px solid #cbd5e1;">${h}</th>`
      ).join('') + '</tr></thead>';

      // Body
      html += '<tbody>';
      rows.forEach((row, idx) => {
        const bg = idx % 2 === 0 ? '#fff' : '#f8fafc';
        html += `<tr style="background:${bg}">` + row.map(cell => {
          const content = cell.replace(/\[View\]\((.*?)\)/g,
            '<a href="$1" target="_blank" style="color:#6b3fd4;font-weight:bold;">View</a>');
          // Sirf td ki style mein yeh change karo:
          return `<td style="border:1px solid #e2e8f0;padding:6px 10px;vertical-align:top;white-space:${cell.includes('View') ? 'nowrap' : 'normal'};">${content}</td>`;
          // return `<td style="border:1px solid #e2e8f0;padding:6px 10px;vertical-align:top;">${content}</td>`;
        }).join('') + '</tr>';
      });
      html += '</tbody></table></div>';

      return html;
    }

    function appendMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.style.maxWidth = type === 'bot' ? '95%' : '80%'; // wider for tables
      div.style.overflowX = 'auto';
      div.innerHTML = type === 'bot' ? formatResponse(text) : text.replace(/\n/g, '<br>');
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
      return div;
    }

    // function appendMessage(text, type) {
    //   const div = document.createElement("div");
    //   div.className = `msg ${type}`;
    //   div.innerHTML = text.replace(/\n/g, "<br>");
    //   chatBody.appendChild(div);
    //   chatBody.scrollTop = chatBody.scrollHeight;
    //   return div;
    // }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      chatInput.value = "";
      sendButton.disabled = true;

      // Show loading indicator
      const loadingEl = appendMessage("Typing...", "bot loading");

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chatInput: message,
            sessionId: sessionId,
          }),
        });

        const data = await response.json();
        const botReply = data.output || data.response || data.text || "No response";

        loadingEl.remove();
        appendMessage(botReply, "bot");
      } catch (error) {
        loadingEl.remove();
        appendMessage("⚠️ Error connecting to server.", "bot");
      }

      sendButton.disabled = false;
      chatInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);
    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>

</html>
